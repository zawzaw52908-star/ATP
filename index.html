<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATK Gaming</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ATK Gaming">
  <meta name="theme-color" content="#0b0e14">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/686/686589.png">

  <link rel="manifest" href='data:application/manifest+json,{"name":"ATK Gaming Platform","short_name":"ATK Gaming","start_url":"/","display":"standalone","background_color":"#0b0e14","theme_color":"#0b0e14","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/686/686589.png","sizes":"512x512","type":"image/png"}]}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: sans-serif; }
    .neon-text { color: #00ffcc; text-shadow: 0 0 5px rgba(0, 255, 204, 0.5); }
    .glass-card { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); }
    
    @keyframes toastFade {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }
    .toast-animate {
      animation: toastFade 3s ease-in-out forwards;
    }
  </style>
</head>
<body class="pb-10 max-w-md mx-auto relative min-h-screen">

  <div id="toast-box" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden w-[90%] max-w-xs">
    <div id="toast-content" class="bg-gray-800/95 border border-cyan-500/50 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between gap-2 backdrop-blur">
      <div class="flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-cyan-400 text-base"></i>
        <span id="toast-msg" class="font-medium"></span>
      </div>
    </div>
  </div>

  <div id="app">
    <nav class="flex items-center justify-between p-4 bg-gray-900 sticky top-0 z-40 border-b border-gray-800">
      <div class="flex items-center gap-2">
        <div onclick="adminClickCheck()" class="w-9 h-9 bg-cyan-500/10 rounded-full flex items-center justify-center border border-cyan-500/30 cursor-pointer active:scale-90 transition select-none">
          <i class="fa-solid fa-gamepad text-cyan-400"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-cyan-400 leading-none">ATK</h1>
          <span id="admin-badge" class="hidden bg-red-500/20 text-red-400 border border-red-500/40 text-[8px] font-bold px-1 rounded">ADMIN MODE</span>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <div id="player-info-container" class="text-right">
          <p id="display-player-name" class="text-xs font-bold text-gray-400">Guest User</p>
          <p id="display-player-id" class="text-[10px] text-gray-500">Not Logged In</p>
        </div>

        <div class="flex items-center gap-1.5 bg-yellow-500/10 border border-yellow-500/30 px-2 py-1 rounded-full">
          <i class="fa-solid fa-ticket text-yellow-400 text-xs"></i>
          <span class="text-xs font-bold text-yellow-400" id="room-card-count">0</span>
        </div>

        <button id="auth-btn" onclick="openModal('login-modal')" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs px-2.5 py-1 rounded-lg transition">
          Login ဝင်ရန်
        </button>
      </div>
    </nav>

    <div id="install-banner" class="hidden px-4 pt-3">
      <div class="glass-card p-3 rounded-xl border border-green-500/40 bg-gradient-to-r from-green-950/40 to-cyan-950/40 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 bg-green-500/20 rounded-xl flex items-center justify-center border border-green-400/50">
            <i class="fa-solid fa-download text-green-400 text-base"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-white">ATK App ဒေါင်းလုဒ်ဆွဲရန်</h4>
            <p class="text-[10px] text-gray-400">ဖုန်းထဲသို့ Application အဖြစ် ထည့်သွင်းမည်</p>
          </div>
        </div>
        <button onclick="installApp()" class="bg-green-500 hover:bg-green-400 text-black font-extrabold text-xs px-3 py-1.5 rounded-lg shadow transition">
          Install ဆွဲမည်
        </button>
      </div>
    </div>

    <div id="admin-panel" class="hidden p-4 bg-red-950/30 border-b border-red-500/30 space-y-2">
      <h3 class="text-xs font-bold text-red-400"><i class="fa-solid fa-user-gear"></i> Admin Balance Controller</h3>
      <div class="flex gap-2">
        <input id="admin-add-amt" type="number" placeholder="ငွေပမာဏ (Ks)" class="w-full bg-gray-900 border border-gray-700 text-white p-2 rounded text-xs">
        <button onclick="adminAddBalance()" class="bg-green-500 text-black font-bold text-xs px-3 rounded whitespace-nowrap">+ ငွေထည့်မည်</button>
        <button onclick="adminSubtractBalance()" class="bg-red
