<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Your Skill</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Show Your Skill">
  <meta name="theme-color" content="#120408">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/686/686589.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #120408; color: #e2e8f0; font-family: sans-serif; }
    .neon-gold { color: #f59e0b; text-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
    .glass-card { background: rgba(30, 9, 16, 0.85); border: 1px solid rgba(239, 68, 68, 0.2); }
    
    @keyframes toastFade {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }
    .toast-animate { animation: toastFade 3s ease-in-out forwards; }
  </style>
</head>
<body class="pb-24 max-w-md mx-auto relative min-h-screen">

  <div id="toast-box" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden w-[90%] max-w-xs">
    <div class="bg-gray-900/95 border border-red-500/50 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 backdrop-blur">
      <i id="toast-icon" class="fa-solid fa-circle-check text-red-500 text-base"></i>
      <span id="toast-msg" class="font-medium"></span>
    </div>
  </div>

  <div class="p-4 bg-[#1a050b] border-b border-red-950 sticky top-0 z-30 space-y-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-red-600/20 flex items-center justify-center border border-red-500/40">
          <i class="fa-solid fa-crown text-red-500 text-sm"></i>
        </div>
        <div>
          <span class="text-[10px] text-red-400 font-bold uppercase tracking-wider block leading-none">CHALLENGER LOBBY</span>
          <h1 class="text-sm font-black text-white">Welcome To Show Your Skill</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1 bg-green-500/10 border border-green-500/30 px-2 py-0.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
          <span class="text-[10px] text-green-400 font-bold">Online 11</span>
        </div>
      </div>
    </div>

    <div class="glass-card p-3 rounded-xl flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <div class="relative">
          <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100" class="w-12 h-12 rounded-full object-cover border-2 border-red-500">
          <span class="absolute -bottom-1 -right-1 bg-yellow-500 text-black text-[9px] font-bold px-1 rounded">MLBB</span>
        </div>
        <div>
          <div class="flex items-center gap-1">
            <h3 class="text-xs font-bold text-white">Mg+Flash <span class="text-[10px] text-cyan-400">(Myanmar (Burma))</span></h3>
            <i class="fa-solid fa-circle-check text-blue-400 text-[10px]"></i>
          </div>
          <p class="text-[10px] text-gray-400">ID: 1484671930 (16218)</p>
        </div>
      </div>
    </div>

    <div class="glass-card p-3 rounded-xl flex items-center justify-between border border-red-500/30 bg-gradient-to-r from-red-950/30 to-black">
      <div>
        <div class="flex items-center gap-3 text-[10px] text-gray-400 mb-1">
          <span class="bg-red-950/60 text-red-400 px-2 py-0.5 rounded border border-red-900"><i class="fa-solid fa-ticket"></i> 0 Tickets</span>
          <span class="bg-yellow-950/60 text-yellow-400 px-2 py-0.5 rounded border border-yellow-900"><i class="fa-solid fa-id-card"></i> 1 Cards (0/10)</span>
        </div>
        <p class="text-xl font-black neon-gold" id="user-balance">300 ကျပ်</p>
      </div>
      <button onclick="openModal('spin-modal')" class="bg-yellow-500 hover:bg-yellow-400 text-black text-xs font-black px-3 py-1.5 rounded-lg shadow">လှည့်မည်</button>
    </div>
  </div>

  <div class="space-y-3 pt-3">
    <div class="px-4 grid grid-cols-3 gap-2">
      <button onclick="showToast('ငွေဖြည့်ရန် စနစ်သို့ ရောက်ရှိပါပြီ')" class="glass-card p-2.5 rounded-xl text-center hover:border-red-500 transition">
        <i class="fa-solid fa-circle-plus text-red-500 text-base mb-1 block"></i>
        <span class="text-[10px] font-bold text-white block">ငွေဖြည့်မည်</span>
      </button>
      <button onclick="showToast('ငွေထုတ်ရန် စနစ်သို့ ရောက်ရှိပါပြီ')" class="glass-card p-2.5 rounded-xl text-center hover:border-red-500 transition">
        <i class="fa-solid fa-circle-down text-red-500 text-base mb-1 block"></i>
        <span class="text-[10px] font-bold text-white block">ငွေထုတ်မည်</span>
      </button>
      <button onclick="openModal('history-modal')" class="glass-card p-2.5 rounded-xl text-center hover:border-red-500 transition">
        <i class="fa-solid fa-file-lines text-red-500 text-base mb-1 block"></i>
        <span class="text-[10px] font-bold text-white block">Orders</span>
      </button>
    </div>

    <div class="px-4">
